<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quiz de l'Avent">
<meta name="theme-color" content="#2a0e16">
<title>Le grand quiz de l'Avent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Vin chaud et guirlandes : fond bordeaux profond, cartes crème, or pour l'action, vert et rouge pour juste et faux. */
  /* Layout : en-tête et score, grille des 24 jours, puis un plateau de jeu plein écran, une question à la fois, lisible de loin. */
  --wine: #2a0e16;
  --wine-2: #3d1722;
  --wine-3: #5a2432;
  --cream: #f4ead9;
  --cream-2: #e6d7bd;
  --gold: #e3b553;
  --ink: #23161a;
  --muted: #d9c3c3;
  --good: #2e7d4f;
  --bad: #b8323a;
  --font-display: "DM Serif Display", Georgia, serif;
  --font-body: "DM Sans", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--wine);
  background-image: radial-gradient(ellipse at 50% 0%, var(--wine-3) 0%, var(--wine) 65%);
  background-attachment: fixed;
  color: var(--cream);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.5;
}
.wrap { max-width: 1040px; margin: 0 auto; padding: 40px 24px 64px; }
header { display: grid; gap: 10px; margin-bottom: 28px; }
.eyebrow { margin: 0; color: var(--gold); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .85rem; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.3rem, 6vw, 4rem); line-height: 1.02; margin: 0; text-wrap: balance; }
.intro { margin: 0; color: var(--muted); max-width: 60ch; }
.scorebar { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; color: var(--muted); font-size: .95rem; }
.scorebar strong { color: var(--cream); font-variant-numeric: tabular-nums; font-size: 1.1rem; }
.flag { background: var(--gold); color: var(--ink); font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 99px; }

.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
@media (max-width: 760px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 9px; } }
.day {
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  position: relative; aspect-ratio: 1; border-radius: 10px;
  border: 1px solid var(--cream-2); background: var(--cream); color: var(--ink);
  font-family: var(--font-display); cursor: pointer; display: grid; place-items: center; padding: 6px;
  box-shadow: 0 6px 16px rgba(0,0,0,.35); transition: transform .15s ease;
}
.day:hover { transform: translateY(-3px); }
.day:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.day .n { font-size: clamp(1.7rem, 4.5vw, 2.6rem); line-height: 1; }
.day .s { position: absolute; bottom: 7px; left: 0; right: 0; text-align: center; font-family: var(--font-body); font-size: .7rem; color: #6d5a52; font-variant-numeric: tabular-nums; }
.day.locked { background: var(--wine-2); color: #9c7f84; border-color: var(--wine-3); box-shadow: none; }
.day.locked .s { color: #9c7f84; }
.day.today { outline: 3px solid var(--gold); outline-offset: 2px; }
.day.done { background: var(--cream-2); }
.day.big { background: var(--gold); border-color: var(--gold); }
.day.big.locked { background: var(--wine-2); border-color: var(--gold); color: var(--gold); }
footer { margin-top: 32px; color: var(--muted); font-size: .85rem; }

/* Plateau de jeu */
.stage { position: fixed; inset: 0; z-index: 10; display: none; background: var(--wine); background-image: radial-gradient(ellipse at 50% 0%, var(--wine-3) 0%, var(--wine) 70%); overflow-y: auto; }
.stage.open { display: block; }
.stage-in { max-width: 920px; margin: 0 auto; padding: 28px 24px 48px; display: grid; gap: 22px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.top .t { font-family: var(--font-display); font-size: 1.4rem; color: var(--gold); margin: 0; }
.btn-ghost { background: none; color: var(--cream); border: 1px solid var(--wine-3); border-radius: 99px; padding: 8px 16px; font: inherit; font-size: .9rem; cursor: pointer; }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--wine-3); }
.dot.cur { background: var(--gold); }
.dot.ok { background: var(--good); }
.dot.ko { background: var(--bad); }
.count { color: var(--muted); font-size: .95rem; margin: 0; font-variant-numeric: tabular-nums; }
.q { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.7rem, 4vw, 2.6rem); line-height: 1.15; margin: 0; text-wrap: balance; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .opts { grid-template-columns: 1fr; } }
.opt {
  touch-action: manipulation; text-align: left; font: inherit; font-size: 1.15rem; font-weight: 500;
  background: var(--cream); color: var(--ink); border: 2px solid var(--cream); border-radius: 10px;
  padding: 16px 18px; min-height: 64px; cursor: pointer; display: flex; gap: 12px; align-items: center;
}
.opt .k { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--wine-2); color: var(--cream); display: grid; place-items: center; font-weight: 700; font-size: .9rem; }
.opt:hover:not(:disabled) { border-color: var(--gold); }
.opt:focus-visible, .btn:focus-visible, .btn-ghost:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.opt:disabled { cursor: default; }
.opt.right { background: #d6ead9; border-color: var(--good); }
.opt.right .k { background: var(--good); }
.opt.wrong { background: #f2d3d5; border-color: var(--bad); }
.opt.wrong .k { background: var(--bad); }
.opt.dim { opacity: .55; }
.feedback { display: none; background: var(--wine-2); border-left: 4px solid var(--gold); border-radius: 8px; padding: 16px 18px; }
.feedback.show { display: block; }
.feedback .v { font-weight: 700; margin: 0 0 6px; font-size: 1.15rem; }
.feedback .v.ok { color: #8fd4a6; }
.feedback .v.ko { color: #f19aa0; }
.feedback p { margin: 0; color: var(--cream); }
.actions { display: flex; justify-content: flex-end; }
.btn { background: var(--gold); color: var(--ink); border: none; border-radius: 99px; padding: 14px 26px; font: inherit; font-weight: 700; font-size: 1.05rem; cursor: pointer; }
.btn[hidden] { display: none; }
.end { text-align: center; display: grid; gap: 14px; justify-items: center; padding: 24px 0; }
.end .big { font-family: var(--font-display); font-size: clamp(3rem, 10vw, 5.5rem); line-height: 1; color: var(--gold); margin: 0; font-variant-numeric: tabular-nums; }
.end p { margin: 0; max-width: 46ch; }
.recap { display: grid; gap: 8px; text-align: left; width: 100%; max-width: 720px; margin-top: 8px; padding: 0; list-style: none; }
.recap li { background: var(--wine-2); border-radius: 8px; padding: 10px 14px; display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; font-size: .95rem; }
.recap .m { font-weight: 700; }
.recap .m.ok { color: #8fd4a6; }
.recap .m.ko { color: #f19aa0; }
.recap .a { color: var(--muted); }
.locked-msg { font-size: 1.2rem; }
@media (prefers-reduced-motion: reduce) { .day { transition: none; } .day:hover { transform: none; } }

/* Connexion téléphone */
.conn { display: inline-flex; align-items: center; gap: 8px; background: var(--wine-2); border: 1px solid var(--wine-3); color: var(--cream); border-radius: 99px; padding: 6px 14px; font: inherit; font-size: .9rem; cursor: pointer; }
.conn .led { width: 10px; height: 10px; border-radius: 50%; background: #8a6a6f; }
.conn.on .led { background: #5fd38a; box-shadow: 0 0 8px #5fd38a; }
.qr-panel { position: fixed; inset: 0; z-index: 20; background: rgba(20,6,10,.85); display: none; align-items: center; justify-content: center; padding: 20px; }
.qr-panel.open { display: flex; }
.qr-card { background: var(--cream); color: var(--ink); border-radius: 14px; padding: 28px; display: grid; gap: 14px; justify-items: center; max-width: 420px; text-align: center; }
.qr-card h2 { font-family: var(--font-display); font-weight: 400; margin: 0; font-size: 1.8rem; }
.qr-card p { margin: 0; color: #5b4a45; font-size: .95rem; }
#qr { background: #fff; padding: 12px; border-radius: 8px; }
.url { font-size: .78rem; word-break: break-all; color: #5b4a45; }
.qr-card .btn { background: var(--wine-2); color: var(--cream); }
.mini-conn { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.mini-conn .led { width: 9px; height: 9px; border-radius: 50%; background: #8a6a6f; }
.mini-conn.on .led { background: #5fd38a; }
.top-r { display: flex; align-items: center; gap: 14px; }

/* Manette (téléphone) */
body.pad { font-size: 18px; }
.pad-wrap { max-width: 520px; margin: 0 auto; padding: 22px 16px calc(28px + env(safe-area-inset-bottom)); display: grid; gap: 16px; min-height: 100%; align-content: start; }
.pad-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pad-head .t { font-family: var(--font-display); color: var(--gold); font-size: 1.3rem; margin: 0; }
.pad h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.9rem; line-height: 1.1; margin: 0; text-wrap: balance; }
.pad .sub { margin: 0; color: var(--muted); }
.pad-days { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pad-days .day { aspect-ratio: 1; }
.pad-days .day .n { font-size: 1.6rem; }
.pad-days .day .s { font-size: .6rem; bottom: 4px; }
.keys { display: grid; gap: 10px; }
.key { touch-action: manipulation; -webkit-tap-highlight-color: transparent; display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; min-height: 72px; padding: 12px 16px; border-radius: 12px; border: 2px solid var(--cream); background: var(--cream); color: var(--ink); font: inherit; font-size: 1.05rem; font-weight: 500; cursor: pointer; }
.key .k { flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--wine-2); color: var(--cream); display: grid; place-items: center; font-weight: 700; font-size: 1.2rem; }
.key:disabled { cursor: default; }
.key.right { background: #d6ead9; border-color: var(--good); }
.key.right .k { background: var(--good); }
.key.wrong { background: #f2d3d5; border-color: var(--bad); }
.key.wrong .k { background: var(--bad); }
.key.dim { opacity: .5; }
.verdict-pad { font-weight: 700; font-size: 1.2rem; margin: 0; }
.verdict-pad.ok { color: #8fd4a6; }
.verdict-pad.ko { color: #f19aa0; }
.pad .btn { width: 100%; padding: 18px; font-size: 1.1rem; }
.pad .big { font-family: var(--font-display); font-size: 4.5rem; color: var(--gold); line-height: 1; margin: 0; text-align: center; }
.status-pad { color: var(--muted); font-size: .9rem; display: flex; align-items: center; gap: 8px; }
.status-pad .led { width: 9px; height: 9px; border-radius: 50%; background: #8a6a6f; }
.status-pad.on .led { background: #5fd38a; }

/* Téléphone en paysage, diffusé sur la télé (AirPlay) */
@media (orientation: landscape) and (max-height: 540px) {
  body:not(.pad) { font-size: 15px; }
  .wrap { padding: 14px max(22px, env(safe-area-inset-right)) 18px max(22px, env(safe-area-inset-left)); }
  header { gap: 6px; margin-bottom: 12px; }
  header .eyebrow, header .intro { display: none; }
  h1 { font-size: 1.9rem; }
  .grid { grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .day { border-radius: 8px; aspect-ratio: 3 / 2; }
  .day .n { font-size: 1.4rem; margin-bottom: 8px; }
  .conn { padding: 4px 12px; font-size: .8rem; }
  .day .s { font-size: .58rem; bottom: 4px; }
  footer { display: none; }
  .stage-in { padding: 12px max(26px, env(safe-area-inset-right)) 14px max(26px, env(safe-area-inset-left)); gap: 10px; }
  .top .t { font-size: 1.1rem; }
  .btn-ghost { padding: 5px 12px; font-size: .8rem; }
  .q { font-size: 1.45rem; }
  .opts { grid-template-columns: 1fr 1fr; gap: 8px; }
  .opt { min-height: 46px; padding: 8px 12px; font-size: 1rem; }
  .opt .k { width: 26px; height: 26px; font-size: .8rem; }
  .feedback { padding: 10px 14px; font-size: .92rem; }
  .feedback .v { font-size: 1rem; margin-bottom: 3px; }
  .btn { padding: 10px 20px; font-size: .95rem; }
  .end { gap: 8px; padding: 6px 0; }
  .end .big { font-size: 3rem; }
  .recap li { padding: 6px 10px; font-size: .85rem; }
  .qr-card { grid-template-columns: auto 1fr; text-align: left; justify-items: start; align-items: center; padding: 18px; max-width: 620px; }
  .qr-card #qr { grid-row: span 4; }
  .qr-card h2 { font-size: 1.5rem; }
}
.awake-tip { font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
